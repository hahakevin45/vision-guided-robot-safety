map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.60
      transform_tolerance: 0.30
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      # Tight static-map corridor: keep predictive collision checking, but do
      # not reject a valid curved path because of costs beyond the next 6 cm.
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.03
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.60
      max_angular_accel: 1.5
      # DWB 參數（launch 換 plugin 時使用；RPP 忽略）：官方 generator 設定，
      # 缺 min_vel_x/vx_samples 時 trajectory 生成 0 條、controller 永不輸出。
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_trans: 0.15
      min_vel_theta: -1.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.2
      max_speed_theta: 1.5
      add_speed_limiting: true
      catch_velocity_errors: false
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 4.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.001
      rot_stopped_velocity: 0.001
      short_circuit_trajectory_evaluation: true
      debug_trajectory_details: true
      # Global plan stays straight through unseen obstacles; these critics let
      # DWB temporarily leave that path instead of preferring a zero command.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.5
      PathDist.scale: 4.0
      GoalDist.scale: 24.0
      GoalAlign.scale: 0.0
      PathAlign.scale: 0.0
      RotateToGoal.scale: 32.0
      Oscillation.scale: 1.0
      # DWB 的加速上限為正、減速下限為負；符號錯誤會讓 dynamic
      # window 上下界反轉，產生 0 條 trajectory。
      acc_lim_x: 0.5
      decel_lim_x: -0.5
      acc_lim_y: 0.5
      decel_lim_y: -0.5
      acc_lim_theta: 1.0
      decel_lim_theta: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 2
      resolution: 0.05
      robot_radius: 0.23
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: false
        map_subscribe_transient_local: true
      # 同一組視覺射線命中：Nav2 直接吃 odom-frame PointCloud2，SAPF
      # 吃等價的 base_link LaserScan，避免模擬感測器與 TF 回呼競態。
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: visual
        visual:
          topic: /visual_obstacle_points
          sensor_frame: ""
          data_type: PointCloud2
          marking: true
          clearing: false
          raytrace_max_range: 3.0
          obstacle_max_range: 3.0
          min_obstacle_height: -0.1
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.28
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      width: 4
      height: 2
      resolution: 0.05
      track_unknown_space: false
      robot_radius: 0.23
      footprint_padding: 0.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.28
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

